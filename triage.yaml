default:
  - tool: git
    hint: https://git-scm.com
  - tool: gh
    hint: https://cli.github.com
  - tool: node
    version: ">=22"
    recommended_from: .nvmrc
    hint: https://nodejs.org
  - tool: pnpm
    version: ">=11"
    hint: brew install pnpm (or see https://pnpm.io/installation)
  - tool: python3
    hint: https://www.python.org

release:
  extends: [default]
  add:
    - tool: bun
      hint: https://bun.sh

ci:
  extends: [default]

# lint-workflows and lint-man need tools the build does not. Kept out of `ci`:
# the CI triage job runs on a bare runner, and the lint jobs install their own.
lint:
  extends: [default]
  add:
    - tool: actionlint
      hint: brew install actionlint (or see https://github.com/rhysd/actionlint)
    - tool: shellcheck
      hint: brew install shellcheck (or apt-get install shellcheck)
    - tool: mandoc
      hint: apt-get install mandoc (ships with macOS)
