packages:
  - "packages/*"

allowBuilds:
  "@firebase/util": false
  # Inspector 2 runs fine from its published build; nothing here needs its scripts.
  "@modelcontextprotocol/inspector": false
  "@vscode/vsce-sign": true
  esbuild: true
  keytar: true
  protobufjs: false

# Keep pnpm-lock.yaml a single YAML document. pnpm 12 otherwise prepends an
# env document (pnpm's own pin) that GitHub's dependency graph and Dependabot
# read as "zero dependencies" and close alerts against:
# https://github.com/dependabot/dependabot-core/issues/15904
# CI installs the packageManager pin directly (.github/actions/setup-node-pnpm),
# so it is unaffected. Remove once fixed.
pmOnFail: ignore
