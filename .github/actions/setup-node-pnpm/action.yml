name: 'Setup Node.js + pnpm + install dependencies'
description: 'Set up Node.js, install the pnpm version pinned in package.json, restore the pnpm cache, then install workspace dependencies with --frozen-lockfile.'

# Composite action so every workflow job that needs the standard
# pnpm + Node toolchain can share one place to bump versions or change
# install flags. Jobs still call `actions/checkout@v7` themselves
# because checkout parameters (token, fetch-depth, path) vary across
# callers — keeping checkout in the workflow keeps this action
# parameter-free.
#
# pnpm is installed with `npm install -g pnpm@<version>`, reading the
# version from the `packageManager: pnpm@<version>` pin in the root
# package.json, so CI runs the pinned pnpm without a runtime self-switch.
# Corepack is out: Node 25+ no longer bundles it, and `.nvmrc` pins Node
# 26, so it only worked because `corepack enable` ran against the runner
# image's preinstalled Node before setup-node. That breaks once the
# images default to Node 25+. pnpm/action-setup stays out too: its
# Windows `pnpm self-update` step intermittently crashed with
# STATUS_STACK_BUFFER_OVERRUN (exit 3221226505), pnpm/action-setup#260.
#
# setup-node runs twice. The first installs Node; `cache: pnpm` can't go
# there because setup-node probes `pnpm store path` and pnpm isn't
# installed yet. The second, with no version input, installs nothing and
# only restores (and in its post step saves) the pnpm store cache.
#
# The Node version is governed by the two-tier policy documented in
# `CONTRIBUTING.md` § "Toolchain & Supported Versions": by default the
# exact version pinned in `.nvmrc` is installed (single source of truth,
# so a floating major can't silently pull in a broken patch release like
# the 26.3.1 fetch regression that broke WIF deploys). Callers can
# override via the `node-version` input (the unit-test matrix in `ci.yml`
# does this to also test against the published consumer floor of Node
# 22); a non-empty input takes precedence over `.nvmrc`.
inputs:
  node-version:
    description: 'Node.js version to install. Empty (the default) reads .nvmrc; set it to override, e.g. the ci.yml support matrix.'
    required: false
    default: ''
  skip-install:
    description: 'Skip the workspace `pnpm install`. The caller must run install itself (e.g. with --cpu/--os flags to pull in cross-target optional native deps).'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        # When node-version is empty, fall back to node-version-file (.nvmrc).
        # Only one of the two is passed at a time to avoid the "both inputs
        # specified" warning from actions/setup-node.
        node-version: ${{ inputs.node-version != '' && inputs.node-version || '' }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}

    - name: Install pnpm
      shell: bash
      run: |
        # packageManager may carry a +sha512 integrity suffix; npm takes the bare version.
        version=$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '').split('+')[0]")
        npm install -g "pnpm@${version}"
        # Put npm's global bin on PATH for later steps: on Windows the global
        # prefix may not be on PATH for the Node setup-node just installed.
        prefix=$(npm prefix -g)
        if [ "$RUNNER_OS" = Windows ]; then bin="$prefix"; else bin="$prefix/bin"; fi
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/pnpm" --version

    - name: Restore pnpm cache
      uses: actions/setup-node@v7
      with:
        cache: pnpm

    - name: Install dependencies
      if: inputs.skip-install != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
