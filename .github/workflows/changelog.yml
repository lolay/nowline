# Changelog fragment check. Make the `changelog` job a required check.
#
# On a PR it fails when a fragment is malformed, when the PR adds an entry
# or heading above the latest release in a CHANGELOG.md that has a
# .changelog/ beside it (only the release step writes new entries; fixing
# a released one is fine), or when the PR adds no fragment and isn't
# labelled no-changelog. Adding or removing the label re-runs it.
#
# It also runs on merge_group, because a required check that never reports
# there stalls the merge queue. In the queue it only validates: the PR run
# already checked for a fragment, and the queue's merge commit has no labels.
name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

# Labels are read live (see "Check fragments"), not from the event payload, so
# there is no concurrency group: a PR opened and labelled in the same second
# starts two runs, and cancelling one left a cancelled run as the latest
# result for the required check, which blocked the merge. Every run now
# reaches the same verdict, and the job takes seconds.
permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the check diffs against the base branch

      - name: Check fragments
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          skip=false
          if [ "$EVENT" = pull_request ] \
            && gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx no-changelog; then
            skip=true
          fi
          if [ "$EVENT" = pull_request ] && [ "$skip" != true ]; then
            make changelog-check BASE="$BASE" REQUIRE=1
          else
            make changelog-check BASE="$BASE"
          fi
