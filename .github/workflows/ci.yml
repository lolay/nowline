name: CI

on:
  push:
    branches: [main]
  pull_request:
  # GitHub merge queue. A queued PR's merge commit runs the full matrix,
  # including the macOS and Windows cells that pull_request skips. `CI gate`
  # is the required check on both events.
  merge_group:
    types: [checks_requested]

# Least-privilege workflow token. CI only reads code; no jobs need to
# write to the repo, post comments, or mint OIDC tokens. Job-level
# `permissions:` blocks can grant more when a specific job needs it.
permissions:
  contents: read

# Cancel prior in-flight runs for the same PR on each new push (last push
# wins). Main-branch pushes each get their own group (refs/heads/main resolves
# uniquely per commit via github.ref), and `cancel-in-progress` resolves to
# `false` for non-PR events so sequential main-branch commits never cancel
# each other — the version-bump commit's build always completes. Merge-queue
# runs get a unique `gh-readonly-queue/...` ref each and never cancel either.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only fast path. On pull_request and merge_group, a change that
  # touches nothing but Markdown outside packages/ and .github/ skips the
  # build, test, determinism, MCP, bundle-size and release-smoke jobs; the
  # skips count as passes in `CI gate`. Push to main never skips: main
  # always gets the full run, so a release cut from it was fully tested.
  #
  # Docs here means `*.md` anywhere except:
  #   packages/**     READMEs ship in npm tarballs, the .vsix (vsce checks
  #                   its README) and the action mirror; test fixtures too.
  #   .github/**      the agent-*.md files compile to workflow lock files.
  #   specs/dsl.md    packages/layout/test/calendar.test.ts reads it.
  # Add a doc to the exception list when a test or build step starts
  # reading it. Biome ignores Markdown, so lint has nothing to check.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == push ]]; then
            echo "push to main: full run"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three-dot compare: everything on HEAD since its merge base with
          # BASE (for merge_group, every PR in the queued group). Renames
          # count both paths. The API lists at most 300 files, so a full
          # list is treated as code rather than trusted.
          files=$(gh api "repos/$REPO/compare/$BASE...$HEAD" \
            --jq '.files // [] | if length >= 300 then "<truncated>" else (.[] | .filename, (.previous_filename // empty)) end')
          code=false
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              packages/* | .github/* | specs/dsl.md | "<truncated>") code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
            if [[ "$code" == true ]]; then
              echo "code change: $f"
              break
            fi
          done <<< "$files"
          [[ "$code" == false ]] && echo "docs-only change: skipping build and test jobs"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint-workflows:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm

      - name: Install actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: make lint-workflows

  lint-man:
    # Linux only: mandoc lint depends only on the page text, and Windows has
    # no mandoc package. The apt version floats with the runner image, so a
    # new mandoc can surface new warnings without a change here.
    name: Lint man pages (mandoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mandoc
        run: sudo apt-get update -q && sudo apt-get install -y -q mandoc

      - name: Lint man pages
        run: make lint-man

  triage:
    name: triage (env doctor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm

      - uses: lolay/triage-action@v0.4
        with:
          profile: ci

  build-test:
    # Docs-only skip: see the `changes` job.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Matrix layout: every supported OS runs on the dev/CI Node version
    # (26, matching .nvmrc), plus an extra Linux-only cell on Node 22 to
    # exercise the published consumer floor (`engines.node: ">=22"` in
    # every @nowline/* package.json). See CONTRIBUTING.md §
    # "Toolchain & Supported Versions" for the two-tier policy. Adding
    # the floor cell only on Linux keeps the matrix at 4 cells instead
    # of doubling it on every OS — macOS/Windows cells exist to catch
    # OS-specific issues, not Node-version regressions.
    #
    # Gate per cell: only {ubuntu-latest, node 26} runs the full `make ci`
    # (lint + build + typecheck + test), so `make pre-commit` locally equals
    # exactly one CI cell. The other three run `make ci-platform` (build-fast
    # + Vitest). Lint (Biome, a native binary), typecheck (TypeScript 7, the
    # native compiler), and the SVG render have never behaved differently by
    # OS or Node version; every platform bug in this repo's history was a
    # Windows path bug, and Vitest caught each one. Keep Vitest on every cell.
    #
    # Event split: pull_request runs only the two Linux cells. macOS and
    # Windows run in the merge queue (merge_group) and on push to main, so
    # every platform still gates main, but a PR push no longer waits on
    # them. The base `os` list carries the split; the `include` entry adds
    # the Node 22 floor cell on Linux in both cases.
    #
    # The job `name:` below is a check context; keep it byte-identical.
    name: Build & test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    # Run every step under bash on all three OSes so the `make` gate steps
    # below work on the windows-latest cell too (Git Bash ships make + bash).
    # Linux/macOS already default to bash, so this only changes the Windows cell.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        node-version: ['26']
        include:
          - { os: ubuntu-latest, node-version: '22' }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node-version }}

      # Run a make gate itself, not a hand-ordered copy of its steps. The
      # checkout has no dist/, so on the canonical cell this is the same
      # fresh-clone `make init && make pre-commit` contributors run. Separate
      # build/lint/typecheck/test steps once ran `build` first and masked a
      # `typecheck` that only passed against prebuilt dist/ types; one `make
      # ci` keeps CI and the local gate in the same order by construction
      # (and builds once, not twice).
      # Only {ubuntu-latest, node 26} runs the full `ci`; see the matrix comment.
      - name: Gate (make ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '26' && 'ci' || 'ci-platform' }} on a clean checkout)
        run: make ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '26' && 'ci' || 'ci-platform' }}

  bundle-size:
    name: Embed bundle size gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm

      - name: Check bundle size + node:* leak
        run: make bundle-size

  determinism:
    # Cross-surface export-determinism gate (specs/export-determinism.md §
    # Enforcement). Deliberately a single dedicated job, NOT part of the
    # multi-OS build-test matrix: it needs a compiled `bun compile` binary and
    # a headless browser, which the matrix does not provision. One canonical
    # environment (ubuntu, Node from .nvmrc) keeps the binary-format goldens
    # (pdf/png) stable — they are pinned per toolchain version, not per OS.
    name: Export determinism gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm

      # Pinned to match the runtime baked into shipped binaries (build.yml).
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Build all packages
        run: make build-fast

      # Surface (a): the standalone binary users actually run (here: linux-x64).
      - name: Compile local CLI binary
        run: make compile TARGET=local

      # Surfaces (a) + (b): compiled CLI binary vs kernel-in-Node.
      - name: Node + compiled-CLI determinism legs
        run: make determinism

      # Surface (c): kernel in a headless browser. install-deps pulls the
      # system libraries chromium-headless-shell needs on a clean runner;
      # `make determinism-browser` then installs the browser and runs the leg.
      - name: Headless-browser determinism leg
        run: |
          pnpm --filter @nowline/integration-tests exec playwright install-deps chromium
          make determinism-browser

  mcp-harness:
    # MCP integration harness (specs/mcp.md § Testing the MCP server). Single
    # ubuntu job — needs a headless browser for the AppBridge UI leg and runs
    # the Inspector CLI smoke against the built stdio server. Not part of the
    # multi-OS matrix for the same reasons as determinism above.
    name: MCP harness gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm

      # build-fast: neither leg reads the rendered examples/ or tests/ SVGs
      # (both use inline sources against packages/mcp/dist).
      - name: Build all packages
        run: make build-fast

      - name: MCP Inspector CLI smoke
        run: make mcp-inspector-smoke

      - name: MCP Apps AppBridge e2e
        run: |
          pnpm --filter @nowline/integration-tests exec playwright install-deps chromium
          make mcp-app-e2e

  release-build-smoke:
    name: Release build smoke (no upload)
    # No `needs:`: this matrix starts in parallel with build-test instead of
    # waiting about 2 minutes for the slowest OS cell. Standard runners are
    # free on this public repo, so running it when tests fail costs nothing,
    # and the `CI gate` job below still blocks the merge if either fails.
    #
    # Skip the full 10-cell matrix on version-bump commits authored by the
    # release bot. Lint / typecheck / test (build-test above) still run —
    # only the expensive compile+package matrix is skipped, because release.yml
    # is about to run the same matrix with upload:true in parallel. The
    # `CI gate` job treats this skip as a pass.
    #
    # CROSS-REFERENCE: the email literal below must match the
    # `GIT_AUTHOR_EMAIL` env var set at the TOP of release.yml
    # (currently "nowline-release-bot@lolay.com"). If they ever drift,
    # bump commits will either (a) redundantly run this expensive matrix
    # alongside release.yml's identical run, or (b) silently stop being
    # filtered if the bot identity changes. Keep both in sync.
    #
    # pull_request builds only the Linux binary and pack cells; the merge
    # queue and push to main build and smoke all ten.
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'push' || github.event.head_commit.author.email != 'nowline-release-bot@lolay.com') }}
    uses: ./.github/workflows/build.yml
    with:
      upload: false
      platforms: ${{ github.event_name == 'pull_request' && 'linux' || 'all' }}

  ci-gate:
    # Aggregate required check. The `main` ruleset requires only this
    # context (scripts/apply-branch-policies.sh), so matrix and job-name
    # changes above never need a lockstep ruleset edit. `if: always()` makes
    # it report even when a dependency fails; it fails when any job below
    # failed or was cancelled. `skipped` passes, because release-build-smoke
    # is legitimately skipped on release-bot pushes and the build and test
    # jobs on docs-only changes (`changes` failing still fails the gate). Keep `needs:` listing
    # every other job in this workflow, and keep the `name:` exact.
    name: CI gate
    if: always()
    needs:
      - changes
      - lint-workflows
      - lint-man
      - triage
      - build-test
      - bundle-size
      - determinism
      - mcp-harness
      - release-build-smoke
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check every job passed or was skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(printf '%s' "$NEEDS_JSON" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::Failed or cancelled: $bad"
            exit 1
          fi
